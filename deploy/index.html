<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>World Model Demo</title>
  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }

    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #view {
      width: min(90vw, 90vh);
      height: min(90vw, 90vh);
      border-radius: 8px;
      box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
      transition: transform 0.1s ease-out;
      image-rendering: pixelated;
    }

    #ui-layer {
      position: absolute;
      bottom: 40px;
      left: 40px;
      color: rgba(255, 255, 255, 0.55);
      pointer-events: none;
      user-select: none;
    }

    #task-panel{
      position: absolute;
      top: 18px;
      left: 18px;
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.85);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      user-select: none;
    }

    #task-panel select, #task-panel button{
      background: rgba(0,0,0,1.0);
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }

    #task-panel button{ cursor: pointer; }

    #record-panel{
      position: absolute;
      top: 60px;
      left: 18px;
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.85);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      user-select: none;
    }
    #record-panel button{
      background: rgba(0,0,0,1.0);
      color: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    #record-panel button:disabled{ opacity: 0.4; cursor: default; }
    #recStart.active{ color:#ff5b5b; border-color:#ff5b5b; }
    #recDot{
      width:10px; height:10px; border-radius:50%;
      background:#ff3b3b; box-shadow:0 0 8px #ff3b3b;
      display:none; animation: recpulse 1s infinite;
    }
    #recDot.on{ display:inline-block; }
    @keyframes recpulse { 50% { opacity: 0.25; } }

    h1 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0;
    }

    p {
      font-size: 10px;
      margin-top: 6px;
      margin-bottom: 0;
      line-height: 1.4;
    }

    #status {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: red;
      box-shadow: 0 0 10px red;
    }

    /* Explicit banner */
    #conn-banner {
      position: absolute;
      top: 18px;
      right: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.85);
      font-size: 12px;
      letter-spacing: 0.5px;
      user-select: none;
    }

    #spinner {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: rgba(255,255,255,0.85);
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="container">
  <canvas id="view" width="512" height="512"></canvas>

  <div id="ui-layer">
    <h1>World Model Demo</h1>
    <p>WASD / IJKL: MOVE</p>
    <p>KEYS: <span id="keysDown">—</span></p>
    <p>LATENCY: <span id="latency">0</span>ms</p>
  </div>

  <div id="task-panel">
    <label for="taskSelect">TASK</label>
    <select id="taskSelect">
      <option value="pusht">PushT</option>
      <option value="bimanual_rope_cam_0">Bimanual Rope Routing</option>
      <option value="single_grasp_cam_0">Mug Grasping</option>
      <option value="bimanual_sweep_cam_0">Bimanual Sweeping</option>
      <option value="redcube" selected>Red Cube (single-arm)</option>
    </select>
  </div>

  <div id="record-panel">
    <span id="recDot"></span>
    <button id="recStart">● REC</button>
    <button id="recStop" disabled>■ STOP &amp; SAVE</button>
    <button id="recDiscard" disabled>✕ DISCARD</button>
    <span id="recStatus">idle</span>
  </div>

  <div id="status" title="connection status"></div>

  <div id="conn-banner">
    <div id="spinner"></div>
    <div id="conn-text">Connecting to server…</div>
  </div>
</div>

<script>
  function setTaskSplashUI(taskId) {
    const cfg = TASK_UI[taskId] || TASK_UI.pusht;

    splashTitle = cfg.title;
    // keep subtitle stateful based on connection:
    // if connected but no frame yet => “Connected! …”
    // otherwise “Connecting …”
    if (ws.readyState === WebSocket.OPEN && !hasReceivedFrame) {
      splashSubtitle = "Connected! Press keys to start";
    } else {
      splashSubtitle = "Connecting to server…";
    }
    splashHint = cfg.hint;

    // swap image
    initImgLoaded = false;
    initImg.onload = () => {
      initImgLoaded = true;
      if (!hasReceivedFrame) drawSplash();
    };
    initImg.onerror = () => {
      initImgLoaded = false;
      if (!hasReceivedFrame) drawSplash();
    };
    initImg.src = cfg.initImage;

    if (!hasReceivedFrame) drawSplash();
  }
  const TASK_UI = {
    pusht: {
      initImage: "real_pusht_topdown/init.png",
      title: "PUSHT (TOPDOWN)",
      hint: "WASD: move left XY | IJKL: move right XY | Press keys to start",
    },
    bimanual_rope_cam_0: {
      initImage: "real_bimanual_rope_cam0/init.png",
      title: "BIMANUAL ROPE (THIRD-PERSON)",
      hint: [
        "WASD: move left XY | QE: move left Z",
        "IJKL: move right XY | UO: move right Z | Press keys to start"],
    },
    single_grasp_cam_0: {
      initImage: "real_single_grasp_cam0/init.png",
      title: "MUG GRASPING (THIRD-PERSON)",
      hint: [
        "WASD: move left XY | IK: move left Z",
        "JL: gripper open / close | Press keys to start"],
    },
    bimanual_sweep_cam_0: {
      initImage: "real_bimanual_sweep_cam0/init.png",
      title: "BIMANUAL SWEEPING (THIRD-PERSON)",
      hint: "WASD: move left XY | IJKL: move right XY | Press keys to start",
    },
    redcube: {
      initImage: "",
      title: "RED CUBE (SINGLE-ARM)",
      hint: [
        "W/S: x   A/D: y   G/H: gripper",
        "(Q/E z, U/O/I/K/J/L rotation are fixed in the data) | Press keys to start"],
    },
  };

  const canvas = document.getElementById('view');
  const ctx = canvas.getContext('2d');

  const status = document.getElementById('status');
  const latencyDisp = document.getElementById('latency');

  const taskSelect = document.getElementById("taskSelect");

  // Adjust this to your backend URL (UNCHANGED)
  const ws = new WebSocket('ws://localhost:8000/ws');

  <!-- const ws = new WebSocket('wss://wangyixuan0720--diffusion-forcing-demo-web.modal.run/ws'); -->

  const banner = document.getElementById('conn-banner');
  const connText = document.getElementById('conn-text');
  const spinner = document.getElementById('spinner');

  // ===== Splash image config =====
  const initImg = new Image();

  let initImgLoaded = false;
  let hasReceivedFrame = false;

  // We will update these texts based on connection state.
  let splashTitle = "WORLD MODEL DEMO";
  let splashSubtitle = "Connecting to server…";
  let splashHint = "Tip: once connected, press any keys to start";

  // define drawSplash(), initImg.onload/onerror, etc...

  // ✅ NOW it's safe to apply the task UI (sets initImg.src and triggers splash redraw)
  setTaskSplashUI(taskSelect.value);

  // Draw initial splash immediately (even before image loads)
  drawSplash();

  function drawSplash() {
    // background gradient
    const g = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    g.addColorStop(0, "#0b0b12");
    g.addColorStop(1, "#111122");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // draw your provided init image (center-fit) if available
    if (initImgLoaded) {
      const cw = canvas.width, ch = canvas.height;
      const iw = initImg.naturalWidth || 1;
      const ih = initImg.naturalHeight || 1;
      const scale = Math.min(cw / iw, ch / ih);
      const dw = Math.floor(iw * scale);
      const dh = Math.floor(ih * scale);
      const dx = Math.floor((cw - dw) / 2);
      const dy = Math.floor((ch - dh) / 2);

      ctx.save();
      ctx.globalAlpha = 0.95;
      ctx.drawImage(initImg, dx, dy, dw, dh);
      ctx.restore();

      // subtle dark overlay for readability
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, cw, ch);
      ctx.restore();
    } else {
      // fallback subtle grid if image isn't loaded
      ctx.save();
      ctx.globalAlpha = 0.10;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1;
      const step = 32;
      for (let x = 0; x <= canvas.width; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
      ctx.restore();
    }

    // text panel
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(18, 18, canvas.width - 36, 110);
    ctx.restore();

    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.font = "18px 'Courier New', Courier, monospace";
    ctx.fillText(splashTitle, 30, 46);

    ctx.fillStyle = "rgba(255,255,255,0.70)";
    ctx.font = "12px 'Courier New', Courier, monospace";
    ctx.fillText(splashSubtitle, 30, 70);

    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.font = "12px 'Courier New', Courier, monospace";
    const hintLines = Array.isArray(splashHint) ? splashHint : [splashHint];
    hintLines.forEach((line, idx) => {
      ctx.fillText(line, 30, 92 + idx * 16); // 16px line spacing
    });
  }

  function setSplashConnecting() {
    splashSubtitle = "Connecting to server…";
    splashHint = "Tip: once connected, press any keys to start";
    drawSplash();
  }

  function setSplashConnected() {
    splashSubtitle = "Connected! Press keys to start";
    splashHint = "Hold keys (WASD/IJKL) to keep sending commands";
    drawSplash();
  }

  function setSplashError(msg) {
    splashSubtitle = msg;
    splashHint = "Try refreshing the page";
    drawSplash();
  }

  initImg.onload = () => {
    initImgLoaded = true;
    if (!hasReceivedFrame) drawSplash();
  };
  initImg.onerror = () => {
    initImgLoaded = false;
    if (!hasReceivedFrame) drawSplash();
  };

  // Draw initial splash immediately (even before image loads)
  drawSplash();

  ws.binaryType = 'arraybuffer';

  let lastSendTimeMs = 0;

  function sendControl(msg){
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
  }
  function setStatusDot(color) {
    status.style.background = color;
    status.style.boxShadow = `0 0 10px ${color}`;
  }

  function showConnectingBanner(text) {
    connText.textContent = text;
    banner.classList.remove("hidden");
    spinner.style.display = "block";
  }

  function hideBanner() {
    banner.classList.add("hidden");
  }

  function showBannerError(text) {
    connText.textContent = text;
    banner.classList.remove("hidden");
    spinner.style.display = "none";
  }

  // initial UI state
  setStatusDot("#b00");
  showConnectingBanner("Connecting to server…");
  setSplashConnecting();

  ws.onopen = () => {
    console.log('Connected');
    setStatusDot("#0f0");
    hideBanner();

    // Optionally send an init message (UNCHANGED)
    if (!hasReceivedFrame) setSplashConnected();

    // keep your init message behavior
    sendControl({ type: "init", task: taskSelect.value });
  };

  ws.onmessage = async (event) => {
    // Control messages (e.g. record_saved) arrive as text JSON; frames as binary.
    if (typeof event.data === 'string') {
      try {
        const m = JSON.parse(event.data);
        if (m.type === 'record_saved') onRecordSaved(m.path);
      } catch (e) {}
      return;
    }

    hasReceivedFrame = true;

    // Frame = 8-byte big-endian float64 timestamp (echo of t_client) + encoded image.
    // Strip the prefix before decoding, and use it for round-trip latency.
    const buf = event.data;
    if (buf.byteLength > 8) {
      const tClient = new DataView(buf).getFloat64(0);
      if (tClient > 0) latencyDisp.innerText = String(Math.round(performance.now() - tClient));
    }
    const imgBytes = buf.slice(8);
    const blob = new Blob([imgBytes], { type: 'image/png' });
    const bitmap = await createImageBitmap(blob);
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  };

  taskSelect.addEventListener("change", () => {
    // update splash immediately
    hasReceivedFrame = false;         // optional: show splash while new task loads
    setTaskSplashUI(taskSelect.value);

    // tell backend to switch
    sendControl({ type: "set_task", task: taskSelect.value });
    lastSentActionJson = null;
    setRecUI('idle');   // backend discards the in-progress recording on task reload
  });

  // ===== Recording controls =====
  const recStart = document.getElementById('recStart');
  const recStop = document.getElementById('recStop');
  const recDiscard = document.getElementById('recDiscard');
  const recStatus = document.getElementById('recStatus');
  const recDot = document.getElementById('recDot');

  function setRecUI(state, info) {
    const recording = (state === 'recording');
    recStart.classList.toggle('active', recording);
    recDot.classList.toggle('on', recording);
    recStart.disabled = recording;
    recStop.disabled = !recording;
    recDiscard.disabled = !recording;
    if (state === 'recording') recStatus.textContent = 'recording…';
    else if (state === 'saving') recStatus.textContent = 'saving…';
    else if (state === 'saved') recStatus.textContent = info ? ('saved ✓ ' + info.split('/').slice(-2).join('/')) : 'saved ✓';
    else recStatus.textContent = 'idle';
  }
  function onRecordSaved(path) { setRecUI(path ? 'saved' : 'idle', path); }

  recStart.onclick   = () => { sendControl({ type: 'record_start' });   setRecUI('recording'); recStart.blur(); };
  recStop.onclick    = () => { sendControl({ type: 'record_stop' });    setRecUI('saving');    recStop.blur(); };
  recDiscard.onclick = () => { sendControl({ type: 'record_discard' }); setRecUI('idle');      recDiscard.blur(); };
  setRecUI('idle');
  ws.onerror = (e) => {
    console.error("WebSocket error:", e);
    setStatusDot("#f80");
    showBannerError("Connection error. Please refresh.");
    if (!hasReceivedFrame) setSplashError("Connection error.");
  };

  ws.onclose = () => {
    console.log('Disconnected from server');
    setStatusDot("#b00");
    showBannerError("Disconnected. Refresh to reconnect.");
    if (!hasReceivedFrame) setSplashError("Disconnected.");
  };

  // ===== Input loop (keep your logic the same) =====
  const keyState = {
    KeyW: false,
    KeyA: false,
    KeyS: false,
    KeyD: false,
    KeyQ: false,
    KeyE: false,
    KeyI: false,
    KeyJ: false,
    KeyK: false,
    KeyL: false,
    KeyU: false,
    KeyO: false,
    KeyG: false,
    KeyH: false,
  };

  const keysDownDisp = document.getElementById('keysDown');
  function updateKeysDisplay() {
    const down = Object.keys(keyState)
      .filter((k) => keyState[k])
      .map((k) => k.replace('Key', ''));
    keysDownDisp.textContent = down.length ? down.join(' ') : '—';
  }

  window.addEventListener('keydown', (e) => {
    if (e.code in keyState) {
      e.preventDefault();
      keyState[e.code] = true;
      updateKeysDisplay();
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code in keyState) {
      e.preventDefault();
      keyState[e.code] = false;
      updateKeysDisplay();
    }
  });

  function buildActionPayload() {
    const w = keyState.KeyW ? 1 : 0;
    const s = keyState.KeyS ? 1 : 0;
    const a = keyState.KeyA ? 1 : 0;
    const d = keyState.KeyD ? 1 : 0;
    const q = keyState.KeyQ ? 1 : 0;
    const e = keyState.KeyE ? 1 : 0;
    const i = keyState.KeyI ? 1 : 0;
    const k = keyState.KeyK ? 1 : 0;
    const j = keyState.KeyJ ? 1 : 0;
    const l = keyState.KeyL ? 1 : 0;
    const u = keyState.KeyU ? 1 : 0;
    const o = keyState.KeyO ? 1 : 0;
    const g = keyState.KeyG ? 1 : 0;
    const h = keyState.KeyH ? 1 : 0;

    return {
      w: w,
      s: s,
      a: a,
      d: d,
      q: q,
      e: e,
      i: i,
      k: k,
      j: j,
      l: l,
      u: u,
      o: o,
      g: g,
      h: h,
    };
  }

  let lastSentActionJson = null;
  const TICK_MS = 1; // 20 Hz (UNCHANGED)

  setInterval(() => {
    if (ws.readyState !== WebSocket.OPEN) return;

    const action = buildActionPayload();
    // Dedup on the key state only (NOT t_client) — otherwise every tick looks "new"
    // and we flood the server at ~1000 Hz, starving its render/step loop.
    const actionJson = JSON.stringify(action);
    if (actionJson !== lastSentActionJson) {
      lastSendTimeMs = Date.now();
      ws.send(JSON.stringify({ type: 'action', action, t_client: performance.now() }));
      lastSentActionJson = actionJson;
    }
  }, TICK_MS);
</script>

</body>
</html>
