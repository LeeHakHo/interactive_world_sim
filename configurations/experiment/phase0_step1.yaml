# Phase 0 v3 Step 1: Stage 1 training with SplitEncoder + L_dom + L_adv.
# See docs/superpowers/specs/2026-05-24-phase0-latent-decompose-design.md.
#
# This file controls only trainer/checkpoint/validation config (mirrors
# exp_latent_dyn.yaml style). The project's Hydra composition order requires
# algorithm/dataset selections AND Phase-0 specific overrides to be passed
# via CLI:
#
#   python main.py experiment=phase0_step1 \
#       algorithm=latent_world_model dataset=play_mixed_eef \
#       algorithm.training_stage=1 \
#       algorithm.latent_decompose.enabled=true \
#       dataset.sample_ratio=0.5 \
#       +name=<run_name>
#
# All `algorithm.*` and `dataset.*` overrides are dotted-key overrides (no `+`
# prefix needed) because the keys exist in the underlying yaml defaults.

defaults:
  - base_pytorch

tasks: [training]

training:
  lr: 8e-5
  precision: 32-true
  batch_size: 4
  max_epochs: -1
  max_steps: 200005
  log_every_n_steps: 10
  checkpointing:
    every_n_train_steps: 10000
  optim:
    gradient_clip_val: 1.0

validation:
  val_every_n_step: 30000
  val_every_n_epoch: null
  batch_size: 8
  limit_batch: 1

test:
  limit_batch: 1
  batch_size: 8

logging:
  metrics:
    - fvd
