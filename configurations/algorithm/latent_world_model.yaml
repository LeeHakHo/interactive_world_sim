defaults:
  - base_pytorch_algo

# training hyperparameters
weight_decay: 1e-4
warmup_steps: 10000
lr_scheduler: linear
optimizer_beta: [0.9, 0.999]
latent_dim: 512
action_dim: 10
enc_dim: 64
num_components: 1
obs_keys: ${dataset.obs_keys}
x_shape:
  - ${eval:'3 * len(${dataset.obs_keys})'}
  - ${dataset.resolution}
  - ${dataset.resolution}
norm_scale: 6.0
num_latent_downsample: 2
num_views: ${eval:'len(${dataset.obs_keys})'}
num_latent_channel: ${eval:'4 * ${algorithm.num_views}'}
latent_resolution: ${eval:'${dataset.resolution} // int(2 ** ${algorithm.num_latent_downsample})'}
training_stage: 1
load_ae: ${eval:'None'}
dtype: ${torch:float}
mask_prev_action: False

device: cuda
noise_level: log_normal
val_render: True
max_val_render_batches: 16  # 最多累积多少 batch 的渲染结果用于计算 FVD/FID 等指标，避免 CPU 内存 OOM

# diffusion-related
scheduling_matrix: autoregressive
uncertainty_scale: 1.0
guidance_scale: 1.0
n_frames: ${dataset.horizon}
dyn_infer_steps: 1
dec_infer_steps: 3
last_frame_loss_only: False
prev_frame_noise_scale: 0.1
robust_latent: False

delta: ${eval:'0.00054 * ${algorithm.num_latent_channel} * ${algorithm.latent_resolution} * ${algorithm.latent_resolution}'}

sampling_strategy: uniform
sampling_strategy_params: []

dynamics:
  _target_: interactive_world_sim.algorithms.latent_dynamics.models.cm_latent_dynamics.CMLatentDynamics
  action_dim: ${algorithm.action_dim}
  latent_dim: ${algorithm.num_latent_channel}
  dim: 64
  action_emb_dim: 512
  resnet_block_groups: 8
  dim_mults: [1, 2]
  attn_dim_head: 128
  attn_heads: 4
  use_linear_attn: True
  use_init_temporal_attn: True
  init_kernel_size: 5
  is_causal: True
  time_emb_type: rotary
  dtype: ${algorithm.dtype}

noise_scheduler:
  _target_: interactive_world_sim.utils.cm_utils.DDPMScheduler
  x_shape: ${algorithm.x_shape}
  timesteps: ${algorithm.diffusion.timesteps}
  sampling_timesteps: ${algorithm.diffusion.sampling_timesteps}
  beta_schedule: ${algorithm.diffusion.beta_schedule}
  schedule_fn_kwargs: ${algorithm.diffusion.schedule_fn_kwargs}
  objective: ${algorithm.diffusion.objective}
  loss_weighting: fused_snr
  snr_clip: ${algorithm.diffusion.snr_clip}
  cum_snr_decay: ${algorithm.diffusion.cum_snr_decay}
  ddim_sampling_eta: ${algorithm.diffusion.ddim_sampling_eta}
  clip_noise: ${algorithm.diffusion.clip_noise}
  stabilization_level: ${algorithm.diffusion.stabilization_level}
  dtype: ${algorithm.dtype}

diffusion:
  # training
  beta_schedule: sigmoid
  objective: pred_v
  use_fused_snr: True
  cum_snr_decay: 0.96
  clip_noise: 6.
  schedule_fn_kwargs: {}
  # sampling
  timesteps: 1000 # ddpm
  sampling_timesteps: 50 # ddim
  ddim_sampling_eta: 0.0
  snr_clip: 5.0
  model_channels: ${algorithm.enc_dim}
  num_latent_downsample: ${algorithm.num_latent_downsample}
  num_latent_channel: ${algorithm.num_latent_channel}
  num_res_blocks: 2
  attention_resolutions: [2, 4, 8]
  dropout: 0.1
  channel_mult: [1, 2, 3]
  num_head_channels: 64
  resblock_updown: True
  use_scale_shift_norm: True
  num_components: ${algorithm.num_components}
  image_size: ${dataset.resolution}
  stabilization_level: 15

dynamo_ssl:
  enabled: false
  encoder_backbone: resnet   # resnet | vit
  loss_coef: 1.0
  pretrained_encoder: false
  feature_dim: 512
  projection_dim: 32
  window_size: ${dataset.horizon}
  n_layer: 6
  n_head: 6
  n_embd: 120
  dropout: 0.0
  covariance_reg_coef: 0.04
  dynamics_loss_coef: 1.0
  ema_beta: null      # null=SimSiam, float=EMA
  beta_scheduling: true
  lr: 1e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  separate_single_views: true
  detach_rec_from_encoder: true   # true: rec_loss不回传到encoder, false: rec_loss也训练encoder
  spatial_proj_mode: plain        # plain: 纯投影(推荐), adaln: [CLS]调制patches
  # SIGReg: Sketch Isotropic Gaussian Regularizer，替代VICReg covariance reg防止表征塌缩
  use_sigreg: false
  sigreg_weight: 0.09            # SIGReg loss权重
  sigreg_knots: 17               # Epps-Pulley统计检验的节点数
  sigreg_num_proj: 1024          # 随机投影方向数
  # Sparse IDM: 在IDM输入上加learned sparse mask，让dynamics loss只流经部分encoder channel
  use_sparse_idm: false
  sparse_lambda: 0.01            # L1 sparsity penalty权重
  sparse_mask_init: 0.0          # mask logit初始值, sigmoid(0)=0.5
  # ViT encoder settings (only used when encoder_backbone=vit)
  vit:
    img_size: ${dataset.resolution}
    patch_size: 8       # 128/8 = 16×16 patches
    embed_dim: 384      # ViT-Small
    depth: 12
    num_heads: 6
    mlp_ratio: 4.0
    drop_rate: 0.0

metrics:
  - fvd

# Phase 0 latent decomposition (HUMAN_ROBOT_ALIGN_PLAN-2 / PHASE0_IWS_PLAN_v3).
# When enabled=false the model is bit-identical to the existing baseline.
# See docs/superpowers/specs/2026-05-24-phase0-latent-decompose-design.md.
latent_decompose:
  enabled: false
  # method: channel_split (v3, GRL adversary on a sliced ViT feature) |
  #         dual_head    (v4, two independent projection heads + CLUB MI penalty,
  #                       decoder untouched so reconstruction is not sacrificed)
  method: channel_split
  d_task: 288
  d_emb: 96
  lambda_dom: 0.1
  # --- channel_split (v3) only ---
  lambda_adv_schedule:
    type: linear_ramp
    start_step: 2000
    end_step: 10000
    start_value: 0.0
    end_value: 0.3
  lr_classifiers: 3.0e-4
  # --- dual_head (v4) only ---
  lambda_club: 1.0          # weight on the CLUB MI upper bound (encoder side)
  club_lr: 1.0e-4           # lr for the variational q-network
  club_every_n_steps: 10    # apply CLUB MI penalty to encoder every N steps (paper: 10)
  club_hidden: 256          # hidden width of the q-network MLPs
